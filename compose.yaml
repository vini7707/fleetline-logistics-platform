services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: logistics
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?set MONGO_ROOT_PASSWORD in your environment}
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--requirepass",
        "${REDIS_PASSWORD:?set REDIS_PASSWORD in your environment}",
      ]
    volumes:
      - redis-data:/data
  api:
    build: ./apps/api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      WEB_ORIGIN: ${WEB_ORIGIN:?set WEB_ORIGIN}
      MONGODB_URI: mongodb://logistics:${MONGO_ROOT_PASSWORD}@mongo:27017/logistics?authSource=admin
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET}
    depends_on:
      mongo:
        condition: service_healthy
  web:
    build: ./apps/web
    restart: unless-stopped
    ports: ["8080:80"]
    depends_on: [api]
volumes:
  mongo-data:
  redis-data:

services:
  - type: web
    name: fleetline-logistics-api
    runtime: docker
    dockerfilePath: apps/api/Dockerfile
    dockerContext: apps/api
    buildFilter:
      paths:
        - apps/api/**
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: WEB_ORIGIN
        sync: false

  - type: web
    name: fleetline-logistics-web
    runtime: static
    buildCommand: npm ci && npm run build -w @logistics/web
    staticPublishPath: apps/web/dist
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
